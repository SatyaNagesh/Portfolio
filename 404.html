<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0A0A0A;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 24px;
    }
    .noise {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat; background-size: 256px 256px;
    }
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .fuzzy-frame {
      position: relative;
      z-index: 1;
      width: 90vw;
      max-width: 900px;
      height: 300px;
      border: none;
      pointer-events: auto;
    }
    .subtitle {
      position: relative; z-index: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem; color: #666; letter-spacing: 0.5px;
      margin-top: 8px; text-align: center;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      position: relative; z-index: 1;
      margin-top: 32px;
      font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500;
      color: #888; text-decoration: none;
      padding: 10px 24px; border: 1px solid #222; border-radius: 8px;
      transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .back-link:hover { color: #fff; border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
    .back-link svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>
  <iframe src="fuzzytext/index.html" class="fuzzy-frame" title="404" loading="eager" aria-hidden="true"></iframe>
  <p class="subtitle">PAGE NOT FOUND</p>
  <a href="./" class="back-link">
    <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to Home
  </a>
</body>
</html>
