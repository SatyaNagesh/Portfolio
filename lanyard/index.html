<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lanyard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

const scene = new THREE.Scene()
scene.background = null

const camera = new THREE.PerspectiveCamera(20, window.innerWidth / window.innerHeight, 0.1, 100)
camera.position.set(0, 0, 30)

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

const ambient = new THREE.AmbientLight(0xffffff, 2)
scene.add(ambient)
const dir1 = new THREE.DirectionalLight(0xffffff, 2)
dir1.position.set(5, 10, 5)
scene.add(dir1)
const dir2 = new THREE.DirectionalLight(0xffffff, 1)
dir2.position.set(-5, -5, 5)
scene.add(dir2)
const dir3 = new THREE.DirectionalLight(0xffffff, 1)
dir3.position.set(0, 0, 10)
scene.add(dir3)

const anchor = new THREE.Vector3(0, 2.8, 0)
const ropeLen = 2.4
const pos = new THREE.Vector3(0.5, anchor.y - ropeLen, 0)
const vel = new THREE.Vector3(0, 0, 0)

let cardGroup = null
const loader = new GLTFLoader()
loader.load('./card.glb', (gltf) => {
  const model = gltf.scene
  cardGroup = new THREE.Group()
  cardGroup.scale.set(2.25, 2.25, 2.25)
  cardGroup.position.copy(pos)
  model.traverse((child) => {
    if (child.isMesh) {
      child.material = child.material.clone()
      if (child.material.map) {
        const texLoader = new THREE.TextureLoader()
        texLoader.load('./profile.png', (tex) => {
          const baseImg = child.material.map.image
          const W = baseImg.width
          const H = baseImg.height
          const canvas = document.createElement('canvas')
          canvas.width = W
          canvas.height = H
          const ctx = canvas.getContext('2d')
          ctx.drawImage(baseImg, 0, 0, W, H)
          const rx = 0
          const ry = 0
          const rw = W * 0.5
          const rh = H * 0.755
          const scale = Math.max(rw / tex.image.width, rh / tex.image.height)
          const dw = tex.image.width * scale
          const dh = tex.image.height * scale
          const dx = rx + (rw - dw) / 2
          const dy = ry + (rh - dh) / 2
          ctx.save()
          ctx.beginPath()
          ctx.rect(rx, ry, rw, rh)
          ctx.clip()
          ctx.drawImage(tex.image, dx, dy, dw, dh)
          ctx.restore()
          const composite = new THREE.CanvasTexture(canvas)
          composite.colorSpace = THREE.SRGBColorSpace
          composite.anisotropy = 16
          composite.needsUpdate = true
          child.material.map = composite
          child.material.needsUpdate = true
          child.material.roughness = 0.9
          child.material.metalness = 0.8
        })
      }
    }
  })
  cardGroup.add(model)
  scene.add(cardGroup)
}, undefined, (err) => {
  console.error('GLB error:', err)
})

const bandPoints = []
const segs = 33
for (let i = 0; i < segs; i++) {
  const t = i / (segs - 1)
  bandPoints.push(new THREE.Vector3(0, anchor.y - t * ropeLen, 0))
}
const bandGeo = new THREE.BufferGeometry().setFromPoints(bandPoints)
const bandMat = new THREE.LineBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.5 })
const bandLine = new THREE.Line(bandGeo, bandMat)
scene.add(bandLine)

const dragging = { active: false }
const pointerWorld = new THREE.Vector3()

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging.active = true
  renderer.domElement.setPointerCapture(e.pointerId)
})
renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging.active) {
    const rect = renderer.domElement.getBoundingClientRect()
    const x = ((e.clientX - rect.left) / rect.width) * 2 - 1
    const y = -((e.clientY - rect.top) / rect.height) * 2 + 1
    pointerWorld.set(x, y, 0.5).unproject(camera)
    const dir = new THREE.Vector3().copy(pointerWorld).sub(camera.position).normalize()
    pointerWorld.add(dir.multiplyScalar(camera.position.length()))
  }
})
renderer.domElement.addEventListener('pointerup', () => {
  dragging.active = false
})

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

function animate() {
  requestAnimationFrame(animate)
  const dt = 0.016
  if (dragging.active) {
    pos.lerp(pointerWorld, 0.12)
    vel.set(0, 0, 0)
  } else {
    vel.y += -10 * dt
    vel.multiplyScalar(0.995)
    pos.add(vel.clone().multiplyScalar(dt))
    const toAnchor = new THREE.Vector3().copy(anchor).sub(pos)
    const dist = toAnchor.length()
    if (dist > ropeLen) {
      toAnchor.normalize()
      pos.copy(anchor.clone().sub(toAnchor.multiplyScalar(ropeLen)))
      const nv = vel.dot(toAnchor)
      if (nv > 0) vel.sub(toAnchor.clone().multiplyScalar(nv))
    }
  }
  if (cardGroup) {
    cardGroup.position.copy(pos)
    const look = new THREE.Vector3().copy(anchor).lerp(pos, 0.3)
    cardGroup.lookAt(look)
  }
  const positions = bandLine.geometry.attributes.position.array
  for (let i = 0; i < segs; i++) {
    const t = i / (segs - 1)
    const c1x = (pos.x - anchor.x) * 0.3 + 0.15
    const c1y = (pos.y - anchor.y) * 0.3
    const c2x = (pos.x - anchor.x) * 0.7 - 0.1
    const c2y = (pos.y - anchor.y) * 0.7
    const tt = t * t
    const tp = 1 - t
    positions[i * 3] = tp * tp * t * anchor.x + 3 * tp * t * t * (anchor.x + c1x) + 3 * tp * tt * (anchor.x + c2x) + tt * t * pos.x
    positions[i * 3 + 1] = tp * tp * t * anchor.y + 3 * tp * t * t * (anchor.y + c1y) + 3 * tp * tt * (anchor.y + c2y) + tt * t * pos.y
    positions[i * 3 + 2] = 0
  }
  bandLine.geometry.attributes.position.needsUpdate = true
  renderer.render(scene, camera)
}
animate()
</script>
</body>
</html>
